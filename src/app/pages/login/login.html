<div class="container">

  <!-- LADO IZQUIERDO -->
  <div class="left">
    <div class="card">
      <div class="logo"></div>
      <h1>Droguería Pili</h1>
      <p>SISTEMA DE GESTIÓN</p>
    </div>
  </div>

  <!-- LADO DERECHO -->
  <div class="right">
    <div class="login-box">
      <h2>Ingresar al sistema</h2>

      <div class="input-group">
        <label>Usuario</label>
        <input type="text" name="usuario" [(ngModel)]="usuario" placeholder="Ingrese su usuario">
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" name="password" [(ngModel)]="password" placeholder="Ingrese su contraseña">
      </div>

    
      <button (click)="entrar()">Ingresar</button>

      <p *ngIf="mensajeError" style="color:red; margin-top:10px;">
        {{ mensajeError }}
      </p>

      

    </div>
  </div>

</div>
