<div class="container">

  <div class="left">
    <div class="card">
      <div class="logo">
        <img src="iconos/flor.png" alt="flor">
      </div>
      <h1>Drogueria Pili</h1>
      <p>SISTEMA DE GESTION</p>
    </div> </div> 

  <div class="right">
    <div class="login-box">
      <h2>Ingresar al sistema</h2>

      <div class="input-group">
        <label>Usuario</label>
        <input type="text" name="usuario" [(ngModel)]="usuario" placeholder="Ingrese su usuario">
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" name="password" [(ngModel)]="password" placeholder="Ingrese su contrasenia">
      </div>

      <button (click)="entrar()">Ingresar</button>

      <p *ngIf="mensajeError" style="color:red; margin-top:10px;">
        {{ mensajeError }}
      </p>
    </div>
  </div>

</div>
